[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h4nb-viz"
version = "0.1.0"
description = "Local web app for the visualization of h4nb_run results. Reads files only."
requires-python = ">=3.10"
license = { text = "See LICENSE in the repository root" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
h4nb-viz = "h4nb_viz.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
h4nb_viz = ["data/*.csv"]
