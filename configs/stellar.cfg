# Stellar systems. Use: h4nb_run config=configs/stellar.cfg ic=... out=... t_end=...
preset=stellar                # Plummer softening eps = 0.0001 (user decision, 2026-11-07).
eta=0.0005                    # About 5e-4 gives 1e-8 per orbit (plan D11). Measure it for your system.
dt_max=0.015625               # 1/64. A power of two.
diag=0.0625                   # 4 * dt_max. One energy check costs N^2/2 pairs.
period=6.283185307179586      # Reference period 2*pi for G = 1, central mass 1, radius 1.
