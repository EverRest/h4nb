# Development machine: 2 x RTX 4070 Ti. Use it for correctness runs and N <= 131072.
# Add preset=agn or preset=stellar on the command line for the model type.
devices=0,1                   # Both cards.
eta=0.0005                    # About 5e-4 gives 1e-8 per orbit (plan D11).
dt_max=0.015625               # 1/64.
diag=0.0625                   # 4 * dt_max.
tile=128                      # Only 128 until T017. T020 measures the best value.
blocks_per_sm=4               # T020 measures the best value.
