# Production machine: GH200. Use it for the 1M runs. The launcher (mpirun or srun) sets the GPU count.
# Add preset=agn or preset=stellar on the command line for the model type.
devices=0                     # One GPU for each process. Several GPUs in one process: list them, for example 0,1,2,3.
eta=0.0005                    # About 5e-4 gives 1e-8 per orbit (plan D11).
dt_max=0.015625               # 1/64.
diag=0.390625                 # 25 * dt_max. At 1M particles one energy check costs about 5e11 pairs.
tile=128                      # Only 128 until T017. T021 measures the best value.
blocks_per_sm=4               # T021 measures the best value.
